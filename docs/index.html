<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGV</title>
</head>
<body>
  <div id="igv"></div>
  <script type="module">
    import igv from "https://cdn.jsdelivr.net/npm/igv@3.8.10/dist/igv.esm.min.js";

    igv.createBrowser(document.getElementById("igv"), {
      genome: "hg38",
      locus: "chr17:7,661,779-7,687,550"
    }).catch(error => {
      document.getElementById("igv").textContent = error.message;
    });
  </script>
</body>
</html>
