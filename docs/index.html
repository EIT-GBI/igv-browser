<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGV</title>
  <link rel="stylesheet" href="widgets.css?v=label-anchor-1">
</head>
<body>
  <fieldset id="widgets" disabled>
    <details id="genome-section">
      <summary>Genome</summary>
      <div class="row">
        <label>Genome <select id="genome" aria-label="Genome"><option value="hg38">Human (GRCh38/hg38)</option></select></label>
      </div>
    </details>
    <details id="tracks-section">
      <summary>Tracks</summary>
      <div class="row">
        <button id="choose" hidden disabled>Choose local tracks folder</button>
        <label id="fallback">Local tracks folder <input id="folder" type="file" webkitdirectory multiple disabled></label>
        <label>Local files <input id="track-files" type="file" multiple></label>
        <input id="track-url" type="url" aria-label="Track URL" placeholder="Track URL">
        <input id="track-index" type="url" aria-label="Track index URL" placeholder="Index URL (optional)">
        <button id="load-track-url">Load track URL</button>
      </div>
      <div id="track-sources" class="row" aria-label="Track sources"></div>
      <div id="catalogue" hidden>
        <div class="row"><strong id="catalogue-title"></strong><input id="track-search" type="search" aria-label="Search tracks" placeholder="Search tracks"><span id="track-count"></span><button id="previous-tracks">Previous</button><button id="next-tracks">Next</button></div>
        <select id="track-results" multiple size="6" aria-label="Available tracks"></select>
        <button id="load-selected-tracks">Load selected tracks</button>
      </div>
    </details>
    <details id="session-section">
      <summary>Session</summary>
      <div class="row">
        <label>Session <select id="session-list" aria-label="Saved sessions"></select></label>
        <button id="load-saved">Load session</button>
        <label>Session file <input id="session-file" type="file" accept=".json,.xml"></label>
        <input id="session-url" type="url" aria-label="Session URL" placeholder="Session URL">
        <button id="load-session-url">Load URL</button>
        <button id="save-session">Save session JSON</button>
      </div>
    </details>
    <div id="image-section" class="row" role="group" aria-label="Save image">
      <label>Save image <input id="image-name" type="text" aria-label="Image name"></label>
      <button id="save-png">Save PNG</button><button id="save-svg">Save SVG</button>
    </div>
    <details id="blat-section">
      <summary>Tools · BLAT</summary>
      <div class="row">
        <label>BLAT sequence <textarea id="blat-sequence" rows="2" cols="55" placeholder="Paste DNA sequence (20–8000 bases)"></textarea></label>
        <button id="blat">Run BLAT</button><small>Sends the sequence to UCSC through IGV’s BLAT service.</small>
      </div>
    </details>
    <details id="circular-section">
      <summary>Circular View</summary>
      <div class="row">
        <label><input id="circular-toggle" type="checkbox"> Circular View</label>
        <label>Size <input id="circular-size" type="number" value="512" min="250" max="1600" step="50" aria-label="Circular View size"></label>
        <button id="circular-clear">Clear chords</button>
      </div>
      <div id="circular"></div>
    </details>
    <div id="scale-section" class="row" role="group" aria-label="Group scaling" hidden>
      <strong>Group scaling</strong><button id="scale-close" type="button" aria-label="Close group scaling">×</button>
      <span id="scale-count" aria-live="polite">0 selected</span>
      <button id="scale-auto" disabled>Group autoscale</button>
      <label>Min <input id="scale-min" type="number" step="any" value="0" aria-label="Group minimum"></label>
      <label>Max <input id="scale-max" type="number" step="any" value="100" aria-label="Group maximum"></label>
      <button id="scale-apply" disabled>Apply group range</button><button id="scale-clear" disabled>Clear selection</button>
    </div>
  </fieldset>
  <p id="status" role="status">Loading IGV…</p>
  <div id="igv"></div>
  <script type="module" src="app.js?v=e2g-highlight-1"></script>
</body>
</html>
